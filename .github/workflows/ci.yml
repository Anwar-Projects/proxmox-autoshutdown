name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: make shellcheck
      - name: Run smoke tests
        run: make test-smoke
      - name: Run integration tests
        run: bash tests/test-integration.sh

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t proxmox-autoshutdown:test -f docker/Dockerfile .

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## Advanced Features (v2.0.0)
            
            ### Async/Concurrency
            - Parallel VM shutdown with semaphore control
            - Async health checks with aiohttp
            
            ### State Machine
            - Formal workflow engine with checkpoints
            - Automatic rollback on failure
            
            ### Prometheus Metrics
            - Metrics endpoint at `:9100/metrics`
            - Grafana dashboard included
            
            ### Multi-Channel Notifications
            - Email, Slack, Discord, PagerDuty support
            - Templated notifications with Jinja2
            
            ### Installation
            ```bash
            # Debian package
            wget https://github.com/Anwar-Projects/proxmox-autoshutdown/releases/download/${{ github.ref_name }}/proxmox-autoshutdown_2.0.0_amd64.deb
            sudo dpkg -i proxmox-autoshutdown_2.0.0_amd64.deb
            
            # Docker
            docker pull ghcr.io/anwar-projects/proxmox-autoshutdown:${{ github.ref_name }}
            
            # Ansible
            ansible-playbook -i inventory ansible/playbook.yml
            ```
